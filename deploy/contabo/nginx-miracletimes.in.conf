# Miracle Times public site — Next.js 15 SSR/ISR behind Nginx (Contabo).
# Install under /etc/nginx/sites-available/ and enable. Adjust TLS paths.
# Does NOT configure Miracle Drugs — keep that site in its own server block.
#
# Replace the previous static `root …/out` + /hooks/rebuild setup with this
# reverse proxy once `next start` is running on 127.0.0.1:3000.

# Rate-limit zone (declare once in http {} if not already present):
# limit_req_zone $binary_remote_addr zone=mt_site:10m rate=10r/s;

upstream miracle_times_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name miracletimes.in www.miracletimes.in;
    return 301 https://miracletimes.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.miracletimes.in;
    # ssl_certificate     /etc/letsencrypt/live/miracletimes.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/miracletimes.in/privkey.pem;
    return 301 https://miracletimes.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name miracletimes.in;

    # ssl_certificate     /etc/letsencrypt/live/miracletimes.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/miracletimes.in/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Defense-in-depth headers (Next also sets CSP via next.config headers()).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Long-lived hashed assets from `next build`
    location /_next/static/ {
        proxy_pass http://miracle_times_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Revalidation is internal (API → http://127.0.0.1:3000/api/revalidate).
    # Do not expose a public rebuild webhook.
    location /api/revalidate {
        # Optional: deny public internet; API should call loopback directly.
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://miracle_times_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=mt_site burst=20 nodelay;
        proxy_pass http://miracle_times_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
