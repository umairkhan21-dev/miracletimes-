# Miracle Times public static site (Contabo + Nginx).
# Install under /etc/nginx/sites-available/ and enable. Adjust TLS paths.
# Does NOT configure Miracle Drugs — keep that site in its own server block.

# Rate-limit zone (declare once in http {} if not already present):
# limit_req_zone $binary_remote_addr zone=mt_site:10m rate=10r/s;

upstream miracle_times_rebuild {
    server 127.0.0.1:4010;
    keepalive 2;
}

server {
    listen 80;
    listen [::]:80;
    server_name miracletimes.in www.miracletimes.in;
    return 301 https://miracletimes.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.miracletimes.in;
    # ssl_certificate     /etc/letsencrypt/live/miracletimes.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/miracletimes.in/privkey.pem;
    return 301 https://miracletimes.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name miracletimes.in;

    # ssl_certificate     /etc/letsencrypt/live/miracletimes.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/miracletimes.in/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/miracletimes/out;
    index index.html;

    # Security headers (static export cannot set these via next.config)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # script-src keeps 'unsafe-inline' only for JSON-LD; boot script is /lang-boot.js
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://api.miracletimes.in; connect-src 'self' https://api.miracletimes.in; upgrade-insecure-requests" always;

    # Internal rebuild webhook (API POSTs FRONTEND_DEPLOY_HOOK_URL here).
    # Token is enforced by the rebuild-webhook process — do not expose without TLS.
    location /hooks/rebuild {
        limit_req zone=mt_site burst=5 nodelay;
        proxy_pass http://miracle_times_rebuild;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
