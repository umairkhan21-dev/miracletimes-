# Miracle Times public site — Next.js 15 SSR/ISR behind Nginx (Contabo).
# Cloudflare Origin Certificate (Full / Full Strict).
# Requires /etc/nginx/conf.d/miracle-times-shared.conf (zones + upstreams).
# Does NOT modify Miracle Drugs.

server {
    listen 80;
    listen [::]:80;
    server_name miracletimes.in www.miracletimes.in;
    return 301 https://miracletimes.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.miracletimes.in;

    ssl_certificate     /etc/ssl/miracletimes/origin.pem;
    ssl_certificate_key /etc/ssl/miracletimes/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MT_SSL:10m;

    return 301 https://miracletimes.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name miracletimes.in;

    ssl_certificate     /etc/ssl/miracletimes/origin.pem;
    ssl_certificate_key /etc/ssl/miracletimes/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MT_SSL:10m;

    # Defense-in-depth headers (Next also sets CSP via next.config headers()).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location /_next/static/ {
        proxy_pass http://miracle_times_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Revalidation is internal (API → http://127.0.0.1:3000/api/revalidate).
    location /api/revalidate {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://miracle_times_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=mt_site burst=20 nodelay;
        proxy_pass http://miracle_times_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
