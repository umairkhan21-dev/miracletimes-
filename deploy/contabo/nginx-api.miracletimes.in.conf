# Miracle Times API + uploads (Contabo + Nginx).
# Node must listen on 127.0.0.1 only (LISTEN_HOST=127.0.0.1).
# Requires /etc/nginx/conf.d/miracle-times-shared.conf (zones + upstreams).

server {
    listen 80;
    listen [::]:80;
    server_name api.miracletimes.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.miracletimes.in;

    # ssl_certificate     /etc/letsencrypt/live/api.miracletimes.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.miracletimes.in/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location / {
        limit_req zone=mt_api burst=40 nodelay;
        proxy_pass http://miracle_times_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
