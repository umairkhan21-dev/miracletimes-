# Miracle Times API + uploads (Contabo + Nginx).
# Cloudflare Origin Certificate (Full / Full Strict).
# Node must listen on 127.0.0.1:4001 only (LISTEN_HOST=127.0.0.1).
# Requires /etc/nginx/conf.d/miracle-times-shared.conf (zones + upstreams).
# Does NOT modify Miracle Drugs (API remains on 127.0.0.1:4000).

server {
    listen 80;
    listen [::]:80;
    server_name api.miracletimes.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.miracletimes.in;

    ssl_certificate     /etc/ssl/miracletimes/origin.pem;
    ssl_certificate_key /etc/ssl/miracletimes/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MT_SSL:10m;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location / {
        limit_req zone=mt_api burst=40 nodelay;
        proxy_pass http://miracle_times_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
