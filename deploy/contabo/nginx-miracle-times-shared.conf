# Miracle Times shared Nginx fragments — install under /etc/nginx/conf.d/
# so /etc/nginx/nginx.conf does not need editing (Ubuntu includes conf.d/*.conf).
# Safe alongside Miracle Drugs; does not define server{} blocks.

limit_req_zone $binary_remote_addr zone=mt_site:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=mt_api:10m rate=20r/s;

upstream miracle_times_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream miracle_times_api {
    # Drugs owns 127.0.0.1:4000 — Times API is 4001 only.
    server 127.0.0.1:4001;
    keepalive 16;
}
