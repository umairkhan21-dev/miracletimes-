# Phase 2 private HTTP vhost — Miracle Times Next.js (SSR/ISR).
# Requires /etc/nginx/conf.d/miracle-times-shared.conf (zones + upstreams).
# Enable for Host-header / loopback testing BEFORE public DNS + TLS.
# Replace with nginx-miracletimes.in.conf after certificates in Phase 3.
#
# Does NOT modify Miracle Drugs. Drugs remains default_server on :80.

server {
    listen 80;
    listen [::]:80;
    server_name miracletimes.in www.miracletimes.in;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /_next/static/ {
        proxy_pass http://miracle_times_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/revalidate {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://miracle_times_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=mt_site burst=20 nodelay;
        proxy_pass http://miracle_times_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
