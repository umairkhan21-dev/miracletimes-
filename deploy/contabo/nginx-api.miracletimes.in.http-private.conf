# Phase 2 private HTTP vhost — Miracle Times API.
# Requires /etc/nginx/conf.d/miracle-times-shared.conf (zones + upstreams).
# Proxy only; no TLS yet. Miracle Drugs stays on 127.0.0.1:4000.
# Replace with nginx-api.miracletimes.in.conf after Phase 3 certificates.

server {
    listen 80;
    listen [::]:80;
    server_name api.miracletimes.in;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        limit_req zone=mt_api burst=40 nodelay;
        proxy_pass http://miracle_times_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
