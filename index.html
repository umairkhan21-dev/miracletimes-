<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miracle Times — Coming Soon</title>
    <meta
      name="description"
      content="Miracle Times is on the way. The first edition is being prepared."
    />
    <meta name="theme-color" content="#100e0c" />
    <meta property="og:title" content="Miracle Times — Coming Soon" />
    <meta
      property="og:description"
      content="Miracle Times is on the way. The first edition is being prepared."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23100e0c'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='16' fill='%23f4efe6'%3EM%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;1,9..144,500&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #100e0c;
        --fg: #f4efe6;
        --muted: #a89f93;
        --line: rgba(244, 239, 230, 0.16);
        --accent: #e24b38;
        --glow: rgba(226, 75, 56, 0.18);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        min-height: 100%;
        background:
          radial-gradient(ellipse 70% 45% at 50% 42%, var(--glow), transparent 70%),
          var(--bg);
        color: var(--fg);
        font-family: "Outfit", system-ui, sans-serif;
        font-weight: 300;
        letter-spacing: 0.01em;
      }

      .grain {
        pointer-events: none;
        position: fixed;
        inset: 0;
        opacity: 0.18;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        mix-blend-mode: overlay;
      }

      .page {
        position: relative;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        padding: 28px 36px 24px;
      }

      header,
      footer {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }

      header {
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }

      header span:last-child,
      footer span:last-child {
        text-align: right;
      }

      .mark {
        height: 44px;
        width: auto;
        display: block;
        justify-self: start;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--fg);
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(226, 75, 56, 0.6);
        animation: pulse 2.2s ease-out infinite;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px 0;
      }

      .kicker {
        margin-bottom: 22px;
        font-size: 13px;
        letter-spacing: 0.38em;
        text-transform: uppercase;
        color: var(--muted);
        animation: rise 0.8s ease both;
      }

      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 560;
        font-size: clamp(4.2rem, 13vw, 9.5rem);
        line-height: 0.86;
        letter-spacing: -0.035em;
        animation: rise 0.9s 0.08s ease both;
      }

      h1 em {
        display: block;
        font-style: italic;
        font-weight: 500;
      }

      .rules {
        width: min(280px, 60vw);
        margin: 28px 0 22px;
        animation: rise 0.9s 0.16s ease both;
      }

      .rules span {
        display: block;
        height: 1px;
        background: var(--fg);
      }

      .rules span + span {
        height: 3px;
        margin-top: 4px;
        background: var(--accent);
        transform-origin: center;
        animation: draw 1s 0.4s ease both;
      }

      .soon {
        font-size: clamp(0.85rem, 1.6vw, 1rem);
        font-weight: 500;
        letter-spacing: 0.46em;
        text-transform: uppercase;
        animation: rise 0.9s 0.24s ease both;
      }

      .lede {
        max-width: 34rem;
        margin-top: 18px;
        font-size: clamp(1.05rem, 2vw, 1.25rem);
        line-height: 1.55;
        color: var(--muted);
        animation: rise 0.9s 0.32s ease both;
      }

      footer {
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes draw {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(226, 75, 56, 0.55);
        }
        70% {
          box-shadow: 0 0 0 8px rgba(226, 75, 56, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(226, 75, 56, 0);
        }
      }

      @media (max-width: 640px) {
        .page {
          padding: 20px 18px 16px;
        }

        header,
        footer {
          letter-spacing: 0.14em;
          font-size: 10px;
        }

        header span:nth-child(2),
        .status {
          letter-spacing: 0.12em;
        }

        .mark {
          height: 34px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="page">
      <header>
        <img class="mark" src="mark.png" alt="Miracle Times" />
        <span class="status"><i class="dot" aria-hidden="true"></i> Preparing</span>
        <span>2026</span>
      </header>

      <main>
        <p class="kicker">A new publication</p>
        <h1>
          Miracle
          <em>Times</em>
        </h1>
        <div class="rules" aria-hidden="true">
          <span></span>
          <span></span>
        </div>
        <p class="soon">Coming soon</p>
        <p class="lede">The first edition is being prepared. Check back shortly.</p>
      </main>

      <footer>
        <span>First edition</span>
        <span>Miracle Times</span>
        <span>On the way</span>
      </footer>
    </div>
  </body>
</html>
